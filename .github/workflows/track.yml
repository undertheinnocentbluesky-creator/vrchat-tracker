name: Run VRChat API Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # 30分ごとにチェック（必要なら変更可能）

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run VRChat API Tracker
        run: |
          python << 'EOF'
          import requests, os, time

          username = os.getenv("VRCHAT_USERNAME")
          password = os.getenv("VRCHAT_PASSWORD")
          key = os.getenv("VRCHAT_KEY")
          webhook = os.getenv("DISCORD_WEBHOOK_URL")
          user_ids = os.getenv("VRCHAT_USER_IDS").split(",")

          print("🔐 Logging in to VRChat...")
          auth = requests.post("https://api.vrchat.cloud/api/1/auth/user",
                               data={"username": username, "password": password}).cookies

          print("✅ Checking friend status...")
          for uid in user_ids:
              user = requests.get(f"https://api.vrchat.cloud/api/1/users/{uid.strip()}", cookies=auth).json()
              print(user["displayName"], user["status"])
              if user["status"] == "active":
                  msg = f"🎉 {user['displayName']} さんがVRChatにログインしました！"
                  requests.post(webhook, json={"content": msg})
          EOF
```
